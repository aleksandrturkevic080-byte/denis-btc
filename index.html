<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Denis BTC Tycoon</title>
    <link rel="manifest" href='data:application/manifest+json,{"name":"Denis BTC Tycoon","short_name":"BTC","start_url":".","display":"standalone","background_color":"#121212","theme_color":"#f7931a","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/5968/5968260.png","sizes":"512x512","type":"image/png"}]}'>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; text-align: center; margin: 0; display: flex; flex-direction: column; justify-content: center; height: 100vh; overflow: hidden; }
        #balance { font-size: 32px; color: #f7931a; margin-bottom: 20px; }
        #clicker { width: 200px; cursor: pointer; transition: transform 0.1s; align-self: center; }
        #clicker:active { transform: scale(0.9); }
    </style>
</head>
<body>
    <div id="balance">0 BTC</div>
    <img id="clicker" src="https://cdn-icons-png.flaticon.com/512/5968/5968260.png" alt="BTC">
    <script>
        let count = 0;
        const btn = document.getElementById('clicker');
        const disp = document.getElementById('balance');
        btn.onclick = () => { count++; disp.innerText = count + " BTC"; };
    </script>
</body>
</html>
